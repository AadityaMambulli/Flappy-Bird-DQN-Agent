name: Deploy Flappy Bird browser demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygbag
        run: python -m pip install pygbag

      - name: Build browser demo
        run: python -m pygbag --build web_demo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_demo/build/web

      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
